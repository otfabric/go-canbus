name: Release

run-name: Release (${{ inputs.bump }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor

permissions:
  contents: write

jobs:
  release:
    uses: otfabric/.github/.github/workflows/go-package-release.yml@v3.8.0
    with:
      bump: ${{ inputs.bump }}
      release-name-prefix: go-canbus
      update-major-tag: false
      # No consumers input: a downstream module does not block a release.
      # Its dependants (audit/dependency-graph.md in otfabric/engineering)
      # are bumped to the new version after it is cut, each in its own
      # pull request (standards/release.md).
    secrets: inherit
