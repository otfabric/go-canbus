name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  # Lint, vet, module checks and the test matrix on every supported Go
  # version. Its coverage run has no vcan interface, so the SocketCAN
  # code is not exercised there: coverage is measured and uploaded by the
  # vcan job instead (run-codecov: false here).
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.3.0
    with:
      run-govulncheck: true
      fuzz-time: 10s
      codecov-name: go-canbus
      run-codecov: false
      coverpkg: >-
        github.com/otfabric/go-canbus,github.com/otfabric/go-canbus/arxml,github.com/otfabric/go-canbus/candb,github.com/otfabric/go-canbus/candb/bits,github.com/otfabric/go-canbus/capture,github.com/otfabric/go-canbus/chaos,github.com/otfabric/go-canbus/codegen,github.com/otfabric/go-canbus/dbc,github.com/otfabric/go-canbus/isotp,github.com/otfabric/go-canbus/kcd,github.com/otfabric/go-canbus/slcan,github.com/otfabric/go-canbus/socketcan,github.com/otfabric/go-canbus/socketcan/link,github.com/otfabric/go-canbus/virtual
      go-versions: '["1.23", "1.24", "1.25", "1.26"]'
    secrets: inherit

  # The SocketCAN, netlink and kernel ISO-TP tests on real vcan
  # interfaces, natively on amd64 and arm64. CANBUS_REQUIRE_VCAN=1 turns a
  # missing interface into a failure, never a skip. Coverage of the whole
  # library is measured here, gated at 90 % and uploaded to Codecov.
  vcan:
    name: vcan (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Load the CAN modules and create vcan0
        # can-isotp is built from the kernel's own source where the runner
        # kernel lacks it (scripts/ci-can-modules.sh). CANBUS_REQUIRE_ISOTP
        # below is unconditional: a failed build is a failure, never a skip.
        run: |
          scripts/ci-can-modules.sh
          for i in vcan0 vcan1; do sudo ip link add $i type vcan; sudo ip link set $i mtu 72 up; done
          sudo ip link add vcanxl0 type vcan && sudo ip link set vcanxl0 mtu 2060 up
          ip -d link show vcan0
      - name: Install tcpdump and Wireshark (pcap oracles)
        # Wireshark dissects CAN XL from 4.4 on; Ubuntu 24.04 has 4.2, the
        # Wireshark PPA the current release.
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update -qq
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tcpdump tshark
          tcpdump --version | head -2
          tshark --version | head -1
      - name: Tests with the race detector
        env:
          CANBUS_REQUIRE_ISOTP: "1"
          CANBUS_REQUIRE_XL: "1"
          CANBUS_REQUIRE_TSHARK: "1"
        run: make test-vcan
      - name: Administration and capture tests (root)
        env:
          CANBUS_REQUIRE_XL: "1"
          CANBUS_REQUIRE_TSHARK: "1"
        run: make test-admin
      - name: Coverage (minimum 90 %)
        env:
          CANBUS_REQUIRE_ISOTP: "1"
          CANBUS_REQUIRE_XL: "1"
          CANBUS_REQUIRE_TSHARK: "1"
        run: make coverage-check coverage-pkg-check
      - name: Upload to Codecov
        if: matrix.arch == 'amd64'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.out
          flags: vcan
          name: go-canbus
          fail_ci_if_error: false

  # The golden output of the code generator follows the generator.
  generate:
    name: Generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
      - run: make generate-check coverpkg-check

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
      - run: make build examples

  # Every package builds for the release platforms, including 32-bit ARM
  # (int has 32 bits there).
  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make cross

  # The tests on macOS and Windows: everything but SocketCAN runs there.
  portable:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
        env:
          GOWORK: "off"
