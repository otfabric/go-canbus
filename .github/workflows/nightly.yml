name: Nightly
run-name: "Nightly on ${{ github.ref_name }}"

# The extended tier (otfabric/engineering standards/testing.md#ci-tiers),
# what a pull request does not wait for:
#
# - chaos: the chaos-monkey suites with many more seeds than CI runs on
#   every pull request: random fault schedules over ISO-TP, the Bus and
#   replay on the virtual bus, and the kernel's ISO-TP against go-canbus's
#   through a chaos bridge between vcan0 and vcan1;
# - fuzz: every fuzz target for 5 minutes (CI runs each for 10 seconds);
# - test-386: the tests where int has 32 bits.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: Seeds per monkey test
        required: false
        default: "500"

permissions:
  contents: read

jobs:
  chaos:
    name: Chaos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: CAN modules, vcan0 and vcan1
        # can-isotp is built from the kernel's own source where the runner
        # kernel lacks it (scripts/ci-can-modules.sh). CANBUS_REQUIRE_ISOTP
        # below is unconditional: a module that cannot be provided is a
        # failure, never a skipped suite.
        run: |
          scripts/ci-can-modules.sh
          for i in vcan0 vcan1; do sudo ip link add $i type vcan; sudo ip link set $i mtu 72 up; done
      - name: Chaos monkey
        env:
          CANBUS_REQUIRE_VCAN: "1"
          CANBUS_REQUIRE_ISOTP: "1"
        run: make chaos CHAOS_ITERATIONS=${{ inputs.iterations || '500' }}

  # Every fuzz target of every package (scripts/fuzz.sh discovers them with
  # go test -list), each for 5 minutes. A failing input is written under
  # the package's testdata/fuzz and uploaded.
  fuzz:
    name: Fuzz (5 minutes a target)
    runs-on: ubuntu-24.04
    # 21 targets at 5 minutes each, and the build of every test binary.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=5m
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-nightly
          path: "**/testdata/fuzz/"

  # Platform width (otfabric/engineering standards/testing.md#platform-width):
  # the codecs, the parsers and the trace readers convert file and wire
  # integers to int, so the tests also run where int has 32 bits. ubuntu
  # runners execute 386 binaries; the race detector does not exist for 386.
  # SocketCAN is not built for 386: its tests are not part of this run.
  test-386:
    name: Tests on a 32-bit architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests with GOARCH=386
        run: GOARCH=386 go test -count=1 ./...
